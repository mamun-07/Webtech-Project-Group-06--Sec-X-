<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Health Goals | Recipe Book & Meal Planner</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/health.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="health-dashboard.html">
        <img src="../images/logo.png" alt="Recipe Book & Meal Planner logo">
        <span>Recipe Book & Meal Planner</span>
      </a>

      <div class="nav-links">
        <a class="nav-link " href="health-dashboard.html">Dashboard</a>
        <a class="nav-link active" href="health-goals.html">Health Goals</a>
      </div>

      <div class="account-area">
        <span class="user-name" id="userName">health</span>
        <span class="account-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"></path>
          </svg>
        </span>
        <a class="logout-button" href="../HomeIndex.html">Logout</a>
      </div>
    </div>
  </div>

  <div class="page-wrap">
    <div class="page-heading">
      <h1>Health Goals & Preferences</h1>
      <p>Set your daily nutrition targets and choose your dietary preferences.</p>
    </div>

    <div class="panel">
      <div class="panel-heading"><h2>Daily Nutrition Goals</h2></div>
      <div class="panel-body goal-grid">
        <div class="goal">
          <label for="calories">🔥 Daily Calorie Goal (kcal)</label>
          <input type="number" id="calories" min="1">
        </div>
        <div class="goal">
          <label for="protein">💪 Protein Goal (g)</label>
          <input type="number" id="protein" min="1">
        </div>
        <div class="goal">
          <label for="carbs">🌾 Carbohydrates Goal (g)</label>
          <input type="number" id="carbs" min="1">
        </div>
        <div class="goal">
          <label for="fat">💧 Fat Goal (g)</label>
          <input type="number" id="fat" min="1">
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-heading"><h2>Dietary Preferences</h2></div>
      <div class="panel-body diet-grid">
        <label class="diet"><input type="checkbox" value="Vegetarian"> Vegetarian</label>
        <label class="diet"><input type="checkbox" value="Vegan"> Vegan</label>
        <label class="diet"><input type="checkbox" value="Low-Carb"> Low-Carb</label>
        <label class="diet"><input type="checkbox" value="Gluten-Free"> Gluten-Free</label>
        <label class="diet"><input type="checkbox" value="Dairy-Free"> Dairy-Free</label>
      </div>
    </div>

    <div class="button-row">
      <button type="button" class="save-button" id="saveBtn">Save Goals</button>
      <button type="button" class="reset-button" id="resetBtn">Reset</button>
      <span class="message" id="message" role="status"></span>
    </div>
  </div>

  <script src="../js/health-goals.js"></script>
</body>
</html>
