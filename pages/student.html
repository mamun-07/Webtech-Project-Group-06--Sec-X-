<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/studentMealPlanner.css">
</head>
<body>
    <div class = "naviBar">
        <img src="../images/studentLogo.jpeg"/>
        <span class = "rbmp">Recipe Book & Meal Planner</span>
        <span class="divider"></span>
        <span class = "meal"><a href="studentMealPlanner.html">Meal Planner</a></span>
        <span class = "shoppinglist"><a href="studentShoppingList.html">Shopping List</a></span>
        <span class = "sname"> Student </span>
        <span class="divider1"></span>
        <span class ="btn-logout"><a href="#">Logout</a></span>
        
    </div>
    <div>
        <h1 class = "wlc">Welcome Back!</h1>
        <p class = "plan">Plan your weekly meals and organize your shopping easily</p>
    </div>
    <div class = "weekplandiv">
        <h2 class = "weekhead">My Weekly Meal Plan</h2>
        <button id = "save-btn" class = "green-btn">💾 Save Template</button>
        <button id = "load-btn" class = "yellow-btn">📂 Load Template</button>
        <button id = "clear-btn" class = "clear-outline" type = "reset">🗑 Clear Week</button>
    </div>
    <h2 class = "reciptionhead">Add Recipe to Plan</h2>
    <div class = "reciptionplandiv">
        <input type="search" class="search" id="search" placeholder="🔍  Search by recipe or ingredient...">
        <div class = "option">
        </div>
        <div class = "day">
            <label for = "day">Day</label>
            <br>
            <select class = day1>
                <option value = "">Select a day</option>
                <option value = "Saturday">Saturday</option>
                <option value = "Sunday">Sunday</option>
                <option value = "Monday">Monday</option>
                <option value = "Tuesday">Tuesday</option>
                <option value = "Wednesday">Wednesday</option>
                <option value = "Thursday">Thursday</option>
                <option value = "Friday">Friday</option>
            </select>
        </div>

        <div class = "mealtime">
            <label for = "mealtime">Meal</label>
            <br>
            <select class = mealtime1>
                <option value = "">Select a meal</option>
                <option value = "Breakfast">Breakfast</option>
                <option value = "lunch">lunch</option>
                <option value = "Dinner">Dinner</option>
            </select>
        </div>
        <button type = "submit" class = "btnAdd">+Add to Meal Plan</button>

    </div>
</body>
</html>
