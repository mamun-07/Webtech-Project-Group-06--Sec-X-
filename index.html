<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Recipe Book &amp; Meal Planner</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="split">
    <div class="form-panel">
      <div class="form-wrap">

        <div class="brand brand-dark">
          <img src="images/logo.png" alt="" class="logo">
          <span class="brand-name">Recipe Book &amp; Meal Planner</span>
        </div>

        <h2>Welcome back</h2>
        <p class="sub">Sign in to continue to your meal planning dashboard.</p>

        <form id="loginForm" novalidate>
          <div id="formError" class="form-error" role="alert" hidden></div>

          <div class="field">
            <label for="username">Username</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"></path>
              </svg>
              <input type="text" id="username" autocomplete="username" placeholder="Enter your username">
            </div>
            <p class="field-error" id="usernameError"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none"></path>
              </svg>
              <input type="password" id="password" autocomplete="current-password" placeholder="Enter your password">
              <button type="button" id="togglePw" class="eye" aria-label="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <p class="field-error" id="passwordError"></p>
          </div>

          <div class="row">
            <label class="check"><input type="checkbox" id="remember"> Remember me</label>
            <a href="#" id="forgotLink">Forgot password?</a>
          </div>

          <p id="notice" class="notice" hidden></p>
          <button type="submit" class="btn">Log in</button>
        </form>

        <p class="alt">Don't have an account? <a href="pages/register.html">Register</a></p>

        <div class="demo">
          <strong>Demo accounts</strong>
          <div class="chips">
            <button type="button" data-user="admin" data-pass="admin123">admin</button>
            <button type="button" data-user="cook" data-pass="cook123">cook</button>
            <button type="button" data-user="health" data-pass="health123">health</button>
            <button type="button" data-user="student" data-pass="student123">student</button>
          </div>
          <small>Click a name to fill in the login.</small>
        </div>

        <nav class="footer-links">
          <a href="pages/privacy.html">Privacy Policy</a>
          <a href="pages/disclaimer.html">Disclaimer</a>
          <a href="pages/about.html">About Us</a>
        </nav>
      </div>
    </div>

    <table id="plannerTable" hidden></table>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
